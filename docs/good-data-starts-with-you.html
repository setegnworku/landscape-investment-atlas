<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Data Starts With You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --forest: #1b4332;
      --gold: #d4a017;
      --cream: #faf8f4;
      --ink: #2d2d2d;
      --ink-muted: #6b6b6b;
      --radius-lg: 12px;
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }
    .video-page {
      min-height: 100vh;
      padding: 3rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top, rgba(45, 106, 79, 0.12), transparent 55%),
        var(--cream);
    }
    .video-shell {
      max-width: 960px;
      width: 100%;
    }
    .video-shell h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 4vw, 2.75rem);
      color: var(--forest);
      margin-bottom: 0.5rem;
    }
    .video-shell .lead {
      color: var(--ink-muted);
      margin-bottom: 1.5rem;
      max-width: 42rem;
    }
    .video-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: 2px solid var(--forest);
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--forest);
      color: #fff;
      border-color: var(--forest);
    }
    .btn-primary:hover { background: #143728; }
    .btn-outline {
      background: transparent;
      color: var(--forest);
    }
    .btn-outline:hover { background: var(--forest); color: #fff; }
    .video-frame {
      background: #0f1f18;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .video-frame video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      background: #000;
    }
    .video-note {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: var(--ink-muted);
    }
    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }
  </style>
</head>
<body>
  <main class="video-page">
    <div class="video-shell">
      <h1>Good Data Starts With You</h1>
      <p class="lead">
        Why the record you enter today matters. Play it here in the browser, or download the MP4 to watch offline.
      </p>

      <div class="video-actions">
        <button type="button" class="btn btn-primary" id="playBtn">Play</button>
        <a class="btn btn-outline" href="good_data_starts_with_you.mp4" download="good_data_starts_with_you.mp4">Download</a>
      </div>

      <div class="video-frame">
        <video
          id="dairyVideo"
          controls
          playsinline
          preload="metadata"
        >
          <source src="good_data_starts_with_you.mp4" type="video/mp4" />
          Your browser does not support HTML video.
        </video>
      </div>

      <p class="video-note">
        Tip: use <strong>Play</strong> to start right away, or <strong>Download</strong> to save the file.
      </p>
    </div>
  </main>

  <div class="footer">International Livestock Research Institute &middot; CGIAR</div>

  <script>
    const video = document.getElementById("dairyVideo");
    const playBtn = document.getElementById("playBtn");
    playBtn.addEventListener("click", async () => {
      try {
        video.scrollIntoView({ behavior: "smooth", block: "center" });
        await video.play();
      } catch (err) {
        video.setAttribute("controls", "controls");
      }
    });
  </script>
</body>
</html>
